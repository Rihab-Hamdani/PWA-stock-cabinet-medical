<div class="page">
  <header class="topbar">
    <span class="name">Mon profil</span>
  </header>

  <main class="content">
    @if (auth.user(); as user) {
      <div class="card">
        <div class="avatar">{{ user.prenom.charAt(0) }}{{ user.nom.charAt(0) }}</div>
        <div class="nom">{{ user.prenom }} {{ user.nom }}</div>
        <div class="email">{{ user.email }}</div>
        <span class="role-badge" [class.role-medecin]="user.role === 'MEDECIN'">
          {{ user.role === 'MEDECIN' ? 'Médecin' : 'Secrétaire' }}
        </span>
      </div>
    }

    <button class="btn-logout" (click)="deconnexion()">Se déconnecter</button>
  </main>
</div>
