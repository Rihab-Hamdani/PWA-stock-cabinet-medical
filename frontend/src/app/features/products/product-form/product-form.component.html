<div class="page">
  <header class="topbar">
    <span class="name">{{ produitId() ? 'Modifier le produit' : 'Nouveau produit' }}</span>
  </header>

  <main class="content">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Nom
        <input type="text" formControlName="nom" />
      </label>

      <label>Catégorie
        <select formControlName="categorieId">
          <option value="" disabled>Choisir…</option>
          @for (cat of categories(); track cat.id) {
            <option [value]="cat.id">{{ cat.nom }}</option>
          }
        </select>
      </label>

      <label>Unité
        <input type="text" formControlName="unite" />
      </label>

      <label>Seuil d'alerte
        <input type="number" formControlName="seuilAlerte" min="0" />
      </label>

      <label>Prix unitaire HT
        <input type="number" formControlName="prixUnitaireHt" min="0" step="0.01" />
      </label>

      <label>Date de péremption (optionnel)
        <input type="date" formControlName="datePeremption" />
      </label>

      <label>Numéro de lot (optionnel)
        <input type="text" formControlName="numeroLot" />
      </label>

      @if (erreur()) { <p class="err">{{ erreur() }}</p> }

      <button type="submit" [disabled]="form.invalid || chargement()">
        {{ chargement() ? 'Enregistrement…' : 'Enregistrer' }}
      </button>
    </form>
  </main>
</div>
