<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <div class="logo"><i class="ti ti-stethoscope"></i></div>
      <h1>Cabinet Médical</h1>
      <p>Gestion de stock</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Email
        <input type="email" formControlName="email" placeholder="vous@cabinet.tn" />
      </label>
      <label>Mot de passe
        <input type="password" formControlName="motDePasse" placeholder="••••••••" />
      </label>

      @if (erreur()) { <p class="err">{{ erreur() }}</p> }
      <a routerLink="/register" class="back-link">Pas encore de compte ? En créer un</a>
      <a routerLink="/mot-de-passe-oublie" class="forgot-link">Mot de passe oublié ?</a>

      <button type="submit" [disabled]="form.invalid || chargement()">
        {{ chargement() ? 'Connexion…' : 'Se connecter' }}
      </button>
    </form>
  </div>
</div>
