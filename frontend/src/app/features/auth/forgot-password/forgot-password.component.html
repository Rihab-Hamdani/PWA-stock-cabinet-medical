<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <div class="logo"><i class="ti ti-key"></i></div>
      <h1>Mot de passe oublié</h1>
      <p>Cabinet Médical</p>
    </div>

    @if (envoye()) {
      <p class="success">
        Si un compte existe avec cet email, un lien de réinitialisation vient d'être envoyé.
      </p>
      <a routerLink="/login" class="back-link">Retour à la connexion</a>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()">
        <label>Email
          <input type="email" formControlName="email" placeholder="vous@cabinet.tn" />
        </label>

        <button type="submit" [disabled]="form.invalid || chargement()">
          {{ chargement() ? 'Envoi…' : 'Envoyer le lien' }}
        </button>

        <a routerLink="/login" class="back-link">Retour à la connexion</a>
      </form>
    }
  </div>
</div>
