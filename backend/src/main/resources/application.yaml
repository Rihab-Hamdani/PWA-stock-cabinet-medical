spring:
  application:
    name: stock
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/stock?stringtype=unspecified}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: false
    baseline-on-migrate: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 3000
          timeout: 3000
          writetimeout: 3000

server:
  port: ${PORT:8090}
  servlet:
    context-path: /api/v1

stock:
  jwt:
    secret: ${JWT_SECRET:dev-secret-a-changer-par-une-cle-de-256-bits-minimum-en-production}
    expiration-ms: 604800000
  alert:
    check-cron: "0 */15 8-16 * * *"
    relance-heures: 2
    heure-debut: 8
    heure-fin: 17
  mail:
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Cabinet Médical}
    api-key: ${MAIL_API_KEY:}
    api-secret: ${MAIL_API_SECRET:}
  rdv:
    # Rappel des rendez-vous X minutes avant l'heure prévue
    rappel-minutes: ${RDV_RAPPEL_MINUTES:45}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  firebase:
    enabled: ${FIREBASE_ENABLED:false}


cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:4200}